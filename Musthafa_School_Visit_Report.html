tion Nursary School (Perinthalmanna); G.L.P.School (Thavaraparambu).", "29 visit row(s) have no place written; the area was taken from the matched school or from the other schools visited that day.", "Second-visit column for A.M.L.P.School (Kidangayam) says 'Note: Courier Issue raised by Principal' – not a month, so no second visit is scheduled for it.", "Second-visit column for Al Fitrah English Medium School (Vazhakkad) says 'not conformed' – not a month, so no second visit is scheduled for it.", "Contact number 9846449240 is used for more than one row: Hill Top Public School (Kunnathukkavu); G U P School (Kunnathukkavu).", "Contact number 7025238795 is used for more than one row: Krishna A.U.PSchool (Thachinganadam); G.M.L.P.School (Pandikad)."]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tel = s => esc(s).replace(/\b(0?\d{10})\b/g, m => `<a class="tel" href="tel:${m}">${m}</a>`);
const chip = (p, why) => `<span class="chip ${p.replace(' ','-')}">${esc(p)}</span>${why ? `<span class="why">${esc(why)}</span>` : ''}`;
const yn = b => b ? '<span class="yes">Yes</span>' : '<span class="no">No</span>';
const store = { get(k){ try { return localStorage.getItem(k) } catch(e){ return null } }, set(k,v){ try { localStorage.setItem(k,v) } catch(e){} } };

$('#sub').textContent = `Malappuram district · visits ${D.period} · prepared ${D.generated}`;

// theme toggle
const applyTheme = t => { if (t) document.documentElement.setAttribute('data-theme', t); };
applyTheme(store.get('theme'));
$('#theme').onclick = () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark' ||
    (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  const t = dark ? 'light' : 'dark'; applyTheme(t); store.set('theme', t);
};

// tabs
const TABS = [['summary','Summary'],['second','Second visits'],['areas','Areas: visited & pending'],
              ['deepika',"Deepika's mobile numbers"],['freepass','Free pass feedback'],['checks','Data checks']];
$('#tabs').innerHTML = TABS.map(([k,l]) => `<button type="button" data-t="${k}">${l}</button>`).join('');
function show(k){
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === k));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === 's-' + k));
  store.set('tab', k);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.t));

function tableHTML(head, rows, cls = []){
  return `<div class="tw"><table><thead><tr>${head.map((h,i) => `<th class="${cls[i]||''}">${h}</th>`).join('')}</tr></thead>
  <tbody>${rows.join('')}</tbody></table></div>`;
}
const areaOpts = (all = 'All areas') => `<option value="">${all}</option>` + D.areas.map(a => `<option>${a}</option>`).join('');
const match = (obj, q) => !q || JSON.stringify(obj).toLowerCase().includes(q);

// ---------------- summary
(function(){
  const S = D.summary, T = {};
  Object.keys(S[0]).forEach(k => { if (k !== 'area') T[k] = S.reduce((a,s) => a + s[k], 0); });
  const k = [['Schools in the 8 areas', T.total], ['Visited', T.covered], ['Pending first visit', T.pending],
             ['Second visit planned', T.second], ["Visited & in Deepika's list", T.in_deepika], ['Free stay pass given', T.free_pass]];
  const row = (s, tot) => `<tr class="${tot?'total':''}"><td>${esc(s.area)}</td><td class="num">${s.total}</td>
    <td class="num">${s.directory} + ${s.extra}</td><td class="num">${s.covered}</td><td class="num">${s.pending}</td>
    <td class="num">${s.second}</td><td class="num">${s.in_deepika} / ${s.not_in_deepika}</td>
    <td class="num">${s.deepika_mob_visited} / ${s.deepika_mobiles}</td><td class="num">${s.free_pass}</td>
    <td><span class="chip High">${s.high}</span> <span class="chip Medium">${s.medium}</span> <span class="chip Low">${s.low}</span></td></tr>`;
  $('#s-summary').innerHTML = `<div class="kpis">${k.map(([l,v]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
  <div class="card"><h2>Area-wise summary</h2>
  ${tableHTML(['Area','Total schools','In lists + extra*','Visited','Pending 1st visit','2nd visit planned',
     'Visited: in Deepika / not','Deepika mobiles visited / total','Free pass','Probability High · Med · Low'],
     S.map(s => row(s)).concat([row({area:'TOTAL', ...T}, true)]), ['','num','num','num','num','num','num','num','num',''])}
  <p class="note"><b>Total schools</b> = schools in the State-syllabus list, Deepika's list and the CBSE/ICSE list for the area, plus
  *<b>extra</b> schools Musthafa visited that are in none of those lists (mostly private English-medium and pre-primary).
  <b>Pending 1st visit</b> = listed schools not visited yet. Probability is for visited schools:
  <span class="chip High">High</span> tour confirmed/booked or free-pass feedback interested ·
  <span class="chip Medium">Medium</span> tour month shared, considering Foggy, free pass given or 2nd visit planned ·
  <span class="chip Low">Low</span> no tour / not interested / wrong number, or not reached yet.</p>
  <p class="note">Checked: Musthafa's sheet (${D.visit_rows} rows → ${D.unique_visited} unique schools), State-syllabus data,
  Deepika's data, CBSE/ICSE lists and the free stay pass feedback. ${D.matched_rows} of ${D.visit_rows} visit rows matched a listed
  school by phone or by school name + place. Areas are the assembly areas from the State-syllabus data.</p></div>`;
})();

// ---------------- second visits
(function(){
  const months = ['September 2026','October 2026','November 2026','December 2026','January 2027','February 2027'];
  const sec = $('#s-second');
  sec.innerHTML = `<div class="card"><h2>Second visit schedule – by month</h2>
   <p class="note">Schools where Musthafa's sheet gives a month for the next visit. September visits are due now; "after Onam vacation" is counted as September.</p>
   <div class="tools"><select id="sv-area">${areaOpts()}</select><select id="sv-month"><option value="">All months</option>${months.map(m=>`<option>${m}</option>`).join('')}</select>
   <input id="sv-q" type="search" placeholder="Search school, contact, remark"><span class="count" id="sv-n"></span></div><div id="sv-body"></div></div>`;
  function draw(){
    const a = $('#sv-area').value, mo = $('#sv-month').value, q = $('#sv-q').value.toLowerCase();
    let n = 0, html = '';
    months.forEach(m => {
      if (mo && mo !== m) return;
      const xs = D.visited.filter(x => x.month === m && (!a || x.area === a) && match(x, q)).sort((x,y) => (x.area+x.name).localeCompare(y.area+y.name));
      if (!xs.length) return; n += xs.length;
      html += `<h3>${m} (${xs.length})</h3>` + tableHTML(['Area','School','Contact person : number','1st visit','Remark from call',"In Deepika?",'Probability'],
        xs.map(x => `<tr><td>${esc(x.area)}</td><td>${esc(x.name)}</td><td>${tel(x.contact)}</td><td class="small">${esc(x.dates)}</td>
          <td class="small">${esc((x.month_note ? x.month_note + ' – ' : '') + x.remark)}</td><td>${yn(x.in_deepika)}</td><td>${chip(x.prob, x.reason)}</td></tr>`));
    });
    $('#sv-body').innerHTML = html || '<p class="note">No schools match.</p>';
    $('#sv-n').textContent = `${n} schools`;
  }
  ['#sv-area','#sv-month','#sv-q'].forEach(s => $(s).oninput = draw); draw();
})();

// ---------------- areas
(function(){
  const sec = $('#s-areas');
  sec.innerHTML = `<div class="card"><div class="tools"><select id="ar-area">${D.areas.map(a=>`<option>${a}</option>`).join('')}</select>
   <select id="ar-prob"><option value="">Any probability</option><option>High</option><option>Medium</option><option>Low</option></select>
   <select id="ar-deep"><option value="">In Deepika: any</option><option value="1">In Deepika: Yes</option><option value="0">In Deepika: No</option></select>
   <input id="ar-q" type="search" placeholder="Search school, place, phone"></div><div id="ar-body"></div></div>`;
  function draw(){
    const a = $('#ar-area').value, p = $('#ar-prob').value, dp = $('#ar-deep').value, q = $('#ar-q').value.toLowerCase();
    store.set('area', a);
    const s = D.summary.find(x => x.area === a);
    const key = d => d.split('.').reverse().join('');
    const vis = D.visited.filter(x => x.area === a && (!p || x.prob === p) && (!dp || x.in_deepika === (dp === '1')) && match(x, q))
      .sort((x,y) => key(x.dates.split(',')[0]).localeCompare(key(y.dates.split(',')[0])) || x.name.localeCompare(y.name));
    const pen = D.pending.filter(x => x.area === a && (!dp || x.in_deepika === (dp === '1')) && match(x, q)).sort((x,y) => x.name.localeCompare(y.name));
    $('#ar-body').innerHTML = `<h2>Area: ${esc(a)}</h2><p class="note"><b>${s.total}</b> schools in total · <b>${s.covered}</b> visited ·
      <b>${s.pending}</b> pending first visit · <b>${s.second}</b> second visits planned · <b>${s.in_deepika}</b> visited schools are in Deepika's list ·
      free pass given to <b>${s.free_pass}</b></p>
      <h3>Visited schools (${vis.length})</h3>` + tableHTML(['Visit date','School','Type','Contact person : number','2nd visit',"In Deepika?",'Free pass','Probability'],
      vis.map(x => `<tr><td class="small">${esc(x.dates)}</td><td>${esc(x.name)}${x.directory && x.directory.toLowerCase() !== x.name.toLowerCase() ? `<span class="why">List name: ${esc(x.directory)}</span>` : ''}</td>
        <td class="small">${esc(x.type)}</td><td>${tel(x.contact)}${x.remark ? `<span class="why">${esc(x.remark)}</span>` : ''}</td>
        <td class="small">${esc(x.month || '–')}</td><td>${yn(x.in_deepika)}</td><td>${x.free_pass ? '<span class="yes">Yes</span>' : '–'}</td><td>${chip(x.prob, x.reason)}</td></tr>`))
      + (p ? '' : `<h3>Pending first visit – listed schools not visited yet (${pen.length})</h3>` + tableHTML(['#','School','Type / board','Classes','Phone (from list)',"In Deepika?"],
      pen.map((x,i) => `<tr><td class="small">${i+1}</td><td>${esc(x.name)}</td><td class="small">${esc(x.board === 'State' ? x.type : x.board)}</td>
        <td class="small">${esc(x.level || '–')}</td><td>${tel(x.phones || '–')}</td><td>${yn(x.in_deepika)}</td></tr>`)));
  }
  const saved = store.get('area'); if (saved && D.areas.includes(saved)) $('#ar-area').value = saved;
  ['#ar-area','#ar-prob','#ar-deep','#ar-q'].forEach(s => $(s).oninput = draw); draw();
})();

// ---------------- Deepika sheet
(function(){
  const R = D.deepika, vis = R.filter(r => r.visited === 'Visited').length;
  $('#s-deepika').innerHTML = `<div class="card"><h2>Sheet: Deepika's data – mobile numbers (Musthafa's areas only)</h2>
   <p class="note">Deepika's list has <b>${D.deepika_in_area}</b> schools in Musthafa's 8 areas; <b>${R.length}</b> have a mobile number.
   Each is checked against Musthafa's visit sheet: <b>${vis}</b> visited, <b>${R.length - vis}</b> not visited yet.
   Where Deepika's mobile differs from the number Musthafa collected, both are shown.</p>
   <div class="tools"><select id="dp-area">${areaOpts()}</select>
   <select id="dp-vis"><option value="">Visited + not visited</option><option>Visited</option><option>Not visited</option></select>
   <input id="dp-q" type="search" placeholder="Search school or number"><span class="count" id="dp-n"></span></div><div id="dp-body"></div></div>`;
  function draw(){
    const a = $('#dp-area').value, v = $('#dp-vis').value, q = $('#dp-q').value.toLowerCase();
    const xs = R.filter(r => (!a || r.area === a) && (!v || r.visited === v) && match(r, q))
      .sort((x,y) => D.areas.indexOf(x.area) - D.areas.indexOf(y.area) || (x.visited !== 'Visited') - (y.visited !== 'Visited') || x.name.localeCompare(y.name));
    $('#dp-n').textContent = `${xs.length} schools`;
    $('#dp-body').innerHTML = tableHTML(['Deepika Sl','School (Deepika)','Area','Block','Type','Mobile (Deepika)','Visited by Musthafa?',"Musthafa's contact",'Free pass feedback','Confirmation probability'],
      xs.map(r => { const ok = r.visited === 'Visited'; return `<tr><td class="small">${esc(r.sl)}</td><td>${esc(r.name)}</td><td class="small">${esc(r.area)}</td>
        <td class="small">${esc(r.block)}</td><td class="small">${esc(r.finance)}</td><td><b>${tel(r.mobile)}</b></td>
        <td>${ok ? `<span class="yes">Visited</span><span class="why">${esc(r.visit_date)}</span>` : '<span class="no">Not visited</span>'}</td>
        <td>${ok ? tel(r.visit_contact) : '–'}</td><td class="small">${esc(r.feedback || '–')}</td><td>${chip(r.prob, ok ? r.reason : '')}</td></tr>`; }));
  }
  ['#dp-area','#dp-vis','#dp-q'].forEach(s => $(s).oninput = draw); draw();
})();

// ---------------- free pass
(function(){
  $('#s-freepass').innerHTML = `<div class="card"><h2>Free stay pass – feedback for Musthafa's schools</h2>
   <p class="note">Rows from the feedback sheet marked "Musthafa", or whose school/phone matches a school in his visit sheet. Rows for other executives are left out.</p>` +
   tableHTML(['Date','Person / phone','School (feedback sheet)','Executive','Persons','Glamping','Opinion (park / stay)','Feedback / final status','Matched visit','Probability'],
   D.freepass.map(f => `<tr><td class="small">${esc(f.date)}</td><td>${esc(f.person)}<br>${tel(f.phone)}</td><td>${esc(f.school || '–')}</td>
     <td class="small">${esc(f.exec)}</td><td class="num">${esc(f.persons)}</td><td class="small">${esc(f.glamping || '–')}</td>
     <td class="small">${esc(f.park || '–')}${f.stay ? `<span class="why">Stay: ${esc(f.stay)}</span>` : ''}</td>
     <td class="small">${esc((f.feedback || '–') + ' / ' + (f.status || '–'))}${f.tour ? `<span class="why">Tour: ${esc(f.tour)}</span>` : ''}</td>
     <td class="small">${esc(f.visit)}${f.area ? ` [${esc(f.area)}]` : ''}</td><td>${f.prob === '-' ? '–' : chip(f.prob)}</td></tr>`)) + '</div>';
})();

// ---------------- checks
$('#s-checks').innerHTML = `<div class="card"><h2>Data checks (things to correct in the sheets)</h2><ul class="checks">${D.checks.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
  <p class="note">Matching: school names in the visit sheet are often short forms (e.g. "G.L.P.School" + place). They were matched using the phone number first,
  then the school type (GLPS, AMUPS, GHSS…) with the place name, allowing for spelling differences (Mambad/Mampad, Kizhisheri/Kizhisseri).
  A school not found in any list shows "In Deepika? = No" and is counted as an extra school in its area.</p></div>`;

const t = store.get('tab'); show(TABS.some(x => x[0] === t) ? t : 'summary');
</script>
</body>
</html>
