body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.tel{white-space:nowrap}

function filt(rows, probKey='probability'){
  const q=state.q.trim().toLowerCase();
  return rows.filter(r=>(!state.area||r.area===state.area)&&(!state.prob||probKey===null||r[probKey]===state.prob)&&(!q||Object.values(r).join(' ').toLowerCase().includes(q)));
}
function tbl(cols, rows){
  if(!rows.length) return '<p class="note">No rows.</p>';
  return `<div class="wrap"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${
   rows.map((r,i)=>`<tr>${cols.map(c=>`<td${c[2]?` class="${c[2]}"`:''}>${c[1](r,i)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

   ['Contact',r=>esc(r.contact)],['Phone',r=>tel(r.phone)],['Latest remark',r=>esc(r.remark)],['Stage',r=>esc(r.stage)],['In Deepika?',r=>esc(r.in_deepika)],['Probability',r=>`<span class="${pcls(r.probability)}">${esc(r.probability)}</span>`]],
 deepika:(area=true)=>[['Sl',r=>r.sl,'num'],['School (Deepika list)',r=>esc(r.school)],['Block',r=>esc(r.block)],...(area?[['Area',r=>esc(r.area)]]:[]),['Mobile',r=>tel(r.mobile)],['Mark',r=>mark(r.deepika_mark)],
   ['Visited by executive?',r=>esc(r.visited)],["Basheer's contact",r=>tel(r.basheer_contact)],['Latest remark',r=>esc(r.remark)],['2nd visit',r=>esc(r.tour_month)],['Free pass',r=>esc(r.freepass)],['Probability',r=>`<span class="${pcls(r.probability)}">${esc(r.probability)}</span>`]],
 pending:(area=true,mob=true)=>[['#',(r,i)=>i+1,'num'],...(area?[['Area',r=>esc(r.area)]]:[]),['School',r=>esc(r.school)],['Deepika Sl',r=>esc(r.deepika_sl),'num'],['Block',r=>esc(r.block)],
   ['Type',r=>esc(r.finance)],['Classes',r=>esc(r.level)],['Board',r=>esc(r.board)],[mob?'Mobile':'Available number (no mobile)',r=>mob?tel(r.mobile)+(r.phones!==r.mobile?`<div class="muted">${esc(r.phones)}</div>`:''):(esc(r.phones)||'<span class="muted">No number in any list</span>')],
   ['Mark',r=>mark(r.deepika_mark)],['Listed in',r=>esc(r.source)]],
 fp:(area=true)=>[['Date',r=>esc(r.date)],...(area?[['Area',r=>esc(r.area)]]:[]),['School / institution',r=>esc(r.school)],['Person',r=>esc(r.person)],['Phone',r=>tel(r.phone)],['Park visit',r=>esc(r.park_date)],
   ['Pax',r=>esc(r.persons),'num'],['Executive',r=>esc(r.exec)],['Stay?',r=>esc(r.glamping)],['Park / stay feedback',r=>esc([r.park_opinion,r.stay_opinion,r.feedback].filter(Boolean).join('; '))],
   ['Tour period',r=>esc(r.tour_period)],['Final status',r=>`<b>${esc(r.status)}</b>`],['In visit log?',r=>esc(r.in_visit_log)],['In Deepika?',r=>esc(r.in_deepika)],['Probability',r=>`<span class="${pcls(r.probability)}">${esc(r.probability)}</span>`]],
};
function summaryView(){
  const keys=[['total','Total listed'],['total_mobile','with mobile'],['deepika',"In Deepika's list"],['deepika_mobile','Deepika mobiles'],['visits','Basheer visits'],['covered','Listed covered'],
   ['fp_only','Free pass only'],['unlisted','Visits not in lists'],['pending','Pending 1st visit'],['pending_mobile','– with mobile'],['pending_nomobile','– no mobile'],['second','2nd visit (month)'],
   ['freepass','Free pass'],['vhigh','High / Very high'],['medium','Medium'],['low','Low / not assessed'],['notint','Not interested']];
  const rows=B.summary;
  let h=`<h2>Area summary</h2><p class="note">Click an area to open all its details.</p><div class="wrap"><table><thead><tr><th>Main area (assembly)</th>${keys.map(k=>`<th>${k[1]}</th>`).join('')}</tr></thead><tbody>`+
   rows.map(s=>`<tr class="clickable" data-area="${esc(s.area)}"><td><b>${esc(s.area)}</b></td>${keys.map(k=>`<td class="num">${s[k[0]]}</td>`).join('')}</tr>`).join('')+
   `<tr><td><b>TOTAL</b></td>${keys.map(k=>`<td class="num"><b>${tot(k[0])}</b></td>`).join('')}</tr></tbody></table></div>`;
  const months=['September','October','November','December','January','February','March'];
  h+=`<h2>Second visit plan – schools per month</h2><div class="wrap"><table><thead><tr><th>Area</th>${months.map(x=>`<th>${x}</th>`).join('')}<th>Total</th></tr></thead><tbody>`+
    rows.filter(s=>s.second).map(s=>`<tr><td><b>${esc(s.area)}</b></td>${months.map(x=>`<td class="num">${s.months[x]||''}</td>`).join('')}<td class="num"><b>${s.second}</b></td></tr>`).join('')+
    `</tbody></table></div><p class="note">${B.meta.month_counts['Month not fixed']} more visits have no month yet and need a call-back (see "2nd visit plan").</p>`;
  h+=`<h2>How to read</h2><ul class="legend">
  <li><span class="p p-VeryHigh">Very High</span> – tour confirmed by the school.</li>
  <li><span class="p p-High">High</span> – visited the park on a free pass and said interested (or used the pass).</li>
  <li><span class="p p-Medium">Medium</span> – school gave a tour month, asked for details, or will confirm.</li>
  <li><span class="p p-Low">Low</span> – call not answered, busy, waiting, or wrong/invalid number.</li>
  <li><span class="p p-Notassessedyet">Not assessed yet</span> – visited recently; no follow-up call noted.</li>
  <li><span class="p p-Notinterested">Not interested</span> – said no, or tour fixed elsewhere.</li>
  <li>Main areas are Kerala assembly constituencies, from the Kozhikode School Data. "Pending 1st visit" = listed schools in that area with no visit and no free pass from Basheer.</li>
  <li>"Deepika mark" = the colour Deepika gave the row (Green / Yellow / Red). The sheet has no legend, so the colour is shown as it is.</li>
  <li>Place ending in * = blank in Basheer's sheet, filled from the previous school visited that day.</li>
  <li>Numbers starting 0495/0496 are school landlines; only 10-digit numbers starting 6–9 count as mobiles.</li></ul>`;
  return h;
}
function areaView(){
  const areas = state.area? [state.area] : AREAS;
  return areas.map(a=>{
    const s=B.summary.find(x=>x.area===a); const f=rows=>rows.filter(r=>r.area===a);
    const sub=(t,cols,rows)=>`<h3>${t} <span class="muted">(${rows.length})</span></h3>`+tbl(cols,rows);
    return `<div class="card"><h2>${esc(a)}</h2><p class="note">Total listed ${s.total} (with mobile ${s.total_mobile}) · Basheer visits ${s.visits} · Listed covered ${s.covered} · Pending first visit ${s.pending} (mobile ${s.pending_mobile} / no mobile ${s.pending_nomobile}) · 2nd visits with month ${s.second} · Free pass ${s.freepass}</p>`+
      sub('A. Visited by Basheer',C.visits(false),filt(f(B.visits)))+
      sub('B. Second visit plan',C.second(false),filt(f(B.second)))+
      sub("C. Deepika's mobile numbers",C.deepika(false),filt(f(B.deepika)))+
      sub('D. Pending first visit – with mobile',C.pending(false,true),filt(f(B.pending.filter(r=>r.has_mobile)),null))+
      sub('E. Pending first visit – no mobile',C.pending(false,false),filt(f(B.pending.filter(r=>!r.has_mobile)),null))+
      sub('F. Free pass feedback',C.fp(false),filt(f(B.freepass)))+`</div>`;
  }).join('');
}
function render(){
  $('#area').value=state.area; $('#prob').value=state.prob; $('#q').value=state.q;
  $('#tabs').innerHTML = TABS.map(([id,label,get])=>{
    const n = get? filt(get(), (id==='pm'||id==='pn')?null:'probability').length : '';
    return `<button class="tab" role="tab" aria-selected="${state.tab===id}" data-tab="${id}">${label}${n!==''?`<span class="n">${n}</span>`:''}</button>`;}).join('');
  let h='';
  const t=state.tab;
  if(t==='summary') h=summaryView();
  else if(t==='areawise') h=areaView();
  else {
    const get=TABS.find(x=>x[0]===t)[2];
    const rows=filt(get(), (t==='pm'||t==='pn')?null:'probability');
    const cols = t==='visits'?C.visits(): t==='second'?C.second(): t==='deepika'?C.deepika(): t==='pm'?C.pending(true,true): t==='pn'?C.pending(true,false): C.fp();
    h=`<div class="count">${rows.length} row(s)${state.area?' in '+esc(state.area):''}</div>`+tbl(cols,rows);
  }
  $('#view').innerHTML=h;
  save();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-tab]'); if(b){state.tab=b.dataset.tab; render();}
  const r=e.target.closest('tr[data-area]'); if(r){state.area=r.dataset.area; state.tab='areawise'; render(); window.scrollTo(0,0);}
});
$('#area').onchange=e=>{state.area=e.target.value; render();};
$('#prob').onchange=e=>{state.prob=e.target.value; render();};
let tq; $('#q').oninput=e=>{clearTimeout(tq); tq=setTimeout(()=>{state.q=e.target.value; render();},200);};
$('#theme').onclick=()=>{const r=document.documentElement; const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); r.dataset.theme=cur==='dark'?'light':'dark';};
render();
</script>
</body>
</html>
